services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stemlab}
      POSTGRES_USER: ${POSTGRES_USER:-stemlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stemlab_local_only}
    volumes: [stemlab-postgres:/var/lib/postgresql/data]
    healthcheck:
      {
        test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }
    restart: unless-stopped
    networks: [data]
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    volumes:
      - ./mosquitto/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      {
        test:
          [
            'CMD-SHELL',
            "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null",
          ],
        interval: 10s,
        timeout: 5s,
        retries: 10,
      }
    restart: unless-stopped
    networks: [device]
  api:
    build: { context: .., dockerfile: services/api/Dockerfile }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-stemlab}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-stemlab}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-stemlab_local_only}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:8081}
      MQTT_URL: ${MQTT_URL:-tcp://mqtt-broker:1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-stemlab-dev}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-stemlab_local_only}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.2}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      postgres: { condition: service_healthy }
      mqtt-broker: { condition: service_healthy }
    healthcheck:
      {
        test:
          [
            'CMD',
            'wget',
            '-q',
            '-O',
            '/dev/null',
            'http://localhost:8080/actuator/health/readiness',
          ],
        interval: 10s,
        timeout: 4s,
        retries: 20,
      }
    restart: unless-stopped
    networks: [data, device, edge]
  web:
    build:
      context: ..
      dockerfile: apps/student-app/Dockerfile
      args: { EXPO_PUBLIC_API_BASE_URL: /api/v1 }
    ports: ['8080:80']
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped
    networks: [edge]
  compiler-worker:
    image: alpine:3.21
    profiles: [simulation]
    command: ['sh', '-c', "echo 'M3 compiler worker is intentionally not implemented'; exit 1"]
    read_only: true
    network_mode: none
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes: { stemlab-postgres: {} }
networks: { data: { internal: true }, device: { internal: true }, edge: {} }
